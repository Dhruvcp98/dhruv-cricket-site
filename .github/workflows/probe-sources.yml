name: probe-sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe source reachability
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          probe () {
            echo "=== $1 :: $2"
            if [ "$1" = "ua" ]; then
              curl -sS -m 25 -A "$UA" -o /tmp/body -w 'http=%{http_code} bytes=%{size_download}\n' "$2"
            else
              curl -sS -m 25 -o /tmp/body -w 'http=%{http_code} bytes=%{size_download}\n' "$2"
            fi
            echo "matchDateHits=$(grep -c 'Match Date' /tmp/body)  grandTotalHits=$(grep -c 'GRAND TOTAL' /tmp/body)  loginHits=$(grep -ci 'password' /tmp/body)"
            head -c 150 /tmp/body | tr '\n' ' '
            echo; echo
          }
          probe plain 'https://stats.bedcl.cricket/clubMain.php'
          probe plain 'https://stats.bedcl.cricket/PlayerBattingStats.php?playerid=102165&overs=25'
          probe plain 'https://stats.bedcl.cricket/SeasonBowlingPlayerStats.php?seasonid=8262&playerid=102165'
          probe plain 'https://cricclubs.com/'
          probe plain 'https://cricclubs.com/MississaugaCricketLeague/playerAllBattingRecords.do?clubId=2565&playerId=2793593'
          probe ua 'https://cricclubs.com/MississaugaCricketLeague/playerAllBattingRecords.do?clubId=2565&playerId=2793593'
          probe ua 'https://cricclubs.com/MississaugaCricketLeague/playerAllBowlingRecords.do?clubId=2565&playerId=2793593'
